<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELOCRACE</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#10131a; --track:#1b2030; --kerb-a:#ff6b35; --kerb-b:#f4f1ea;
  --ink:#eef1f6; --amber:#ff6b35; --cyan:#3ee6d8; --dim:#6b7488;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --ink:#eef1f6; } }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--asphalt);overflow:hidden;
  font-family:'Oswald',sans-serif; color:var(--ink);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
#wrap{position:relative;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;touch-action:none;}

#hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 18px;pointer-events:none;}
.hud-block{background:rgba(16,19,26,.72);border:1px solid rgba(255,107,53,.35);
  border-radius:4px;padding:8px 14px;backdrop-filter:blur(4px);}
.hud-label{font-size:10px;letter-spacing:.08em;color:var(--dim);font-family:'JetBrains Mono',monospace;}
.hud-value{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--cyan);line-height:1.1;}
#speedo .hud-value{color:var(--amber);}

#posList{position:absolute;top:70px;right:18px;background:rgba(16,19,26,.72);
  border:1px solid rgba(255,107,53,.25);border-radius:4px;padding:8px 12px;font-size:13px;
  font-family:'JetBrains Mono',monospace;min-width:110px;}
#posList div{padding:2px 0;color:var(--dim);}
#posList div.me{color:var(--ink);font-weight:700;}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(10,12,16,.88);flex-direction:column;gap:18px;text-align:center;padding:24px;}
#overlay.hide{display:none;}
h1{font-size:clamp(36px,8vw,64px);margin:0;letter-spacing:.02em;color:var(--ink);}
h1 span{color:var(--amber);}
#overlay p{margin:0;color:var(--dim);max-width:420px;line-height:1.5;font-size:15px;}
button{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;letter-spacing:.03em;
  background:var(--amber);color:#1a0d06;border:none;border-radius:3px;padding:14px 34px;
  cursor:pointer;transition:transform .12s ease;}
button:hover{transform:translateY(-2px);}
button:active{transform:translateY(0);}
.keys{display:flex;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);}
.keys kbd{border:1px solid var(--dim);border-radius:3px;padding:3px 7px;}
#finishStats{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-size:15px;line-height:1.8;}

#touchControls{position:absolute;bottom:18px;left:0;right:0;display:none;justify-content:space-between;
  padding:0 18px;pointer-events:none;}
.tc-group{display:flex;gap:10px;pointer-events:auto;}
.tc-btn{width:62px;height:62px;border-radius:50%;background:rgba(255,107,53,.22);
  border:1px solid rgba(255,107,53,.5);color:var(--ink);font-size:22px;display:flex;
  align-items:center;justify-content:center;user-select:none;}
@media (pointer:coarse){ #touchControls{display:flex;} }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-block" id="speedo"><div class="hud-label">SPEED</div><div class="hud-value" id="speedVal">0</div></div>
  <div class="hud-block"><div class="hud-label">LAP</div><div class="hud-value" id="lapVal">1/3</div></div>
  <div class="hud-block"><div class="hud-label">TIME</div><div class="hud-value" id="timeVal">0.0</div></div>
</div>
<div id="posList"></div>

<div id="touchControls">
  <div class="tc-group"><div class="tc-btn" id="btnLeft">◀</div><div class="tc-btn" id="btnRight">▶</div></div>
  <div class="tc-group"><div class="tc-btn" id="btnBrake">▣</div><div class="tc-btn" id="btnGas">▲</div></div>
</div>

<div id="overlay">
  <h1>VELO<span>RACE</span></h1>
  <p>Three laps, three rivals. Drift the corners, hold your line, take the checkered flag. Arrow keys or WASD to drive — hold Shift to brake.</p>
  <div class="keys"><kbd>↑/W</kbd> Gas <kbd>↓/S</kbd> Brake <kbd>←→ / A D</kbd> Steer</div>
  <button id="startBtn">START ENGINE</button>
  <div id="finishStats"></div>
</div>
</div>

<script>
(function(){
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W,H,DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

// ---- Track definition: oval-ish circuit via centerline points ----
const cx=0, cy=0, RX=560, RY=360;
const trackPts=[];
const N=64;
for(let i=0;i<N;i++){
  const a = (i/N)*Math.PI*2;
  // figure-eight-ish pinch for character
  const wob = 1 + 0.12*Math.sin(a*2);
  trackPts.push({x: cx+Math.cos(a)*RX*wob, y: cy+Math.sin(a)*RY*wob});
}
const TRACK_WIDTH = 150;

function nearestSeg(px,py){
  let best=1e18,bi=0,bt=0;
  for(let i=0;i<N;i++){
    const p1=trackPts[i], p2=trackPts[(i+1)%N];
    const dx=p2.x-p1.x, dy=p2.y-p1.y;
    const len2=dx*dx+dy*dy;
    let t=((px-p1.x)*dx+(py-p1.y)*dy)/len2;
    t=Math.max(0,Math.min(1,t));
    const sx=p1.x+dx*t, sy=p1.y+dy*t;
    const d=(px-sx)**2+(py-sy)**2;
    if(d<best){best=d;bi=i;bt=t;}
  }
  return {dist:Math.sqrt(best), index:bi, t:bt};
}

// checkpoints evenly spaced along track indices
const CHECKPOINTS = 8;
const cpIdx = [];
for(let i=0;i<CHECKPOINTS;i++) cpIdx.push(Math.floor(i*N/CHECKPOINTS));

class Car{
  constructor(color,isPlayer,skill){
    this.x=trackPts[0].x; this.y=trackPts[0].y;
    this.angle = Math.atan2(trackPts[1].y-trackPts[0].y, trackPts[1].x-trackPts[0].x);
    this.speed=0; this.color=color; this.isPlayer=isPlayer;
    this.skill=skill||0.8;
    this.lap=1; this.nextCp=1; this.finished=false; this.finishTime=null;
    this.progress=0; // for ranking
    this.driftDust=[];
  }
  update(dt, input){
    const MAXSPEED = 420, ACCEL=260, BRAKE=420, FRICTION=140, TURN=2.6;
    let gas=0, steer=0, brake=false;
    if(this.isPlayer){
      gas = input.gas?1:(input.brake?-0.6:0);
      brake = input.brake;
      steer = (input.left?-1:0)+(input.right?1:0);
    } else {
      // AI: steer toward point ahead on track
      const look = nearestSeg(this.x,this.y);
      const aheadIdx = (look.index + 3) % N;
      const target = trackPts[aheadIdx];
      let desired = Math.atan2(target.y-this.y, target.x-this.x);
      let diff = desired - this.angle;
      while(diff>Math.PI) diff-=Math.PI*2;
      while(diff<-Math.PI) diff+=Math.PI*2;
      steer = Math.max(-1,Math.min(1, diff*2.2));
      gas = this.speed < MAXSPEED*this.skill ? 1 : 0.4;
    }
    if(gas>0) this.speed += ACCEL*gas*dt;
    else if(brake) this.speed -= BRAKE*dt;
    this.speed -= FRICTION*dt*(this.speed>0?1:0);
    this.speed = Math.max(0, Math.min(MAXSPEED*(this.isPlayer?1:this.skill), this.speed));

    const turnFactor = Math.min(1, this.speed/150);
    this.angle += steer*TURN*dt*turnFactor*(this.speed>5?1:0);

    this.x += Math.cos(this.angle)*this.speed*dt;
    this.y += Math.sin(this.angle)*this.speed*dt;

    // track constraint
    const info = nearestSeg(this.x,this.y);
    if(info.dist > TRACK_WIDTH/2){
      const push = (info.dist-(TRACK_WIDTH/2-2));
      const seg1=trackPts[info.index], seg2=trackPts[(info.index+1)%N];
      const nx=-(seg2.y-seg1.y), ny=(seg2.x-seg1.x);
      const nl=Math.hypot(nx,ny)||1;
      const sign = ((this.x-seg1.x)*nx/nl + (this.y-seg1.y)*ny/nl) > 0 ? 1:-1;
      this.x -= sign*nx/nl*push*0.5;
      this.y -= sign*ny/nl*push*0.5;
      this.speed *= 0.93;
    }

    // checkpoint & lap logic
    const cpTargetIdx = cpIdx[this.nextCp % CHECKPOINTS];
    const cpPt = trackPts[cpTargetIdx];
    if(Math.hypot(this.x-cpPt.x,this.y-cpPt.y) < TRACK_WIDTH*0.8){
      this.nextCp++;
      if(this.nextCp % CHECKPOINTS === 0){
        if(this.lap>=3 && !this.finished){
          this.finished=true;
        } else {
          this.lap++;
        }
      }
    }
    this.progress = this.lap*CHECKPOINTS + this.nextCp + info.t*0.01;

    if(Math.abs(steer)>0.3 && this.speed>120 && Math.random()<0.4){
      this.driftDust.push({x:this.x,y:this.y,life:0.4});
    }
    this.driftDust.forEach(d=>d.life-=dt);
    this.driftDust = this.driftDust.filter(d=>d.life>0);
  }
}

let cars=[];
let player;
let raceTime=0, running=false, countdown=0;
let camX=0,camY=0;

function initRace(){
  cars = [
    new Car('#ff6b35', true),
    new Car('#3ee6d8', false, 0.90),
    new Car('#c792ea', false, 0.86),
    new Car('#ffd166', false, 0.93),
  ];
  // slight stagger
  cars.forEach((c,i)=>{ c.x -= i*34*Math.cos(c.angle+1.57); c.y -= i*34*Math.sin(c.angle+1.57); });
  player = cars[0];
  raceTime=0; countdown=3; running=false;
}

const input={gas:false,brake:false,left:false,right:false};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','w','W'].includes(e.key)) input.gas=true;
  if(['ArrowDown','s','S'].includes(e.key)) input.brake=true;
  if(['ArrowLeft','a','A'].includes(e.key)) input.left=true;
  if(['ArrowRight','d','D'].includes(e.key)) input.right=true;
});
window.addEventListener('keyup',e=>{
  if(['ArrowUp','w','W'].includes(e.key)) input.gas=false;
  if(['ArrowDown','s','S'].includes(e.key)) input.brake=false;
  if(['ArrowLeft','a','A'].includes(e.key)) input.left=false;
  if(['ArrowRight','d','D'].includes(e.key)) input.right=false;
});
function bindTouch(id,key){
  const el=document.getElementById(id);
  const set=v=>e=>{e.preventDefault();input[key]=v;};
  el.addEventListener('touchstart',set(true));
  el.addEventListener('touchend',set(false));
  el.addEventListener('touchcancel',set(false));
}
bindTouch('btnGas','gas'); bindTouch('btnBrake','brake');
bindTouch('btnLeft','left'); bindTouch('btnRight','right');

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2 - camX, H/2 - camY);

  // track surface
  ctx.lineWidth = TRACK_WIDTH;
  ctx.strokeStyle = getCss('--track');
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  trackPts.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath(); ctx.stroke();

  // kerb stripes
  ctx.lineWidth = TRACK_WIDTH+14;
  ctx.setLineDash([22,22]);
  ctx.strokeStyle = getCss('--kerb-a');
  ctx.beginPath();
  trackPts.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath(); ctx.globalCompositeOperation='destination-over';
  ctx.stroke();
  ctx.globalCompositeOperation='source-over';
  ctx.setLineDash([]);

  // re-draw surface on top of kerb edge
  ctx.lineWidth = TRACK_WIDTH;
  ctx.strokeStyle = getCss('--track');
  ctx.beginPath();
  trackPts.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath(); ctx.stroke();

  // centerline dashes
  ctx.lineWidth=4; ctx.setLineDash([16,20]); ctx.strokeStyle='rgba(255,255,255,.18)';
  ctx.beginPath();
  trackPts.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);

  // start/finish line
  const s1=trackPts[0], s2=trackPts[1];
  const ang=Math.atan2(s2.y-s1.y,s2.x-s1.x);
  ctx.save(); ctx.translate(s1.x,s1.y); ctx.rotate(ang+Math.PI/2);
  for(let i=-TRACK_WIDTH/2;i<TRACK_WIDTH/2;i+=14){
    ctx.fillStyle = (Math.floor((i+TRACK_WIDTH/2)/14)%2===0)?'#f4f1ea':'#10131a';
    ctx.fillRect(-4,i,8,14);
  }
  ctx.restore();

  // dust
  cars.forEach(c=>c.driftDust.forEach(d=>{
    ctx.globalAlpha = Math.max(0,d.life/0.4)*0.4;
    ctx.fillStyle='#cfcfcf';
    ctx.beginPath(); ctx.arc(d.x,d.y,6,0,7); ctx.fill();
  }));
  ctx.globalAlpha=1;

  // cars
  cars.forEach(c=>{
    ctx.save();
    ctx.translate(c.x,c.y); ctx.rotate(c.angle);
    ctx.fillStyle = c.color;
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(14,0); ctx.lineTo(-10,-8); ctx.lineTo(-6,0); ctx.lineTo(-10,8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  });

  ctx.restore();
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function updateHUD(){
  document.getElementById('speedVal').textContent = Math.round(player.speed*0.6);
  document.getElementById('lapVal').textContent = Math.min(player.lap,3)+'/3';
  document.getElementById('timeVal').textContent = raceTime.toFixed(1);
  const ranked = [...cars].sort((a,b)=>b.progress-a.progress);
  const list = document.getElementById('posList');
  list.innerHTML = ranked.map((c,i)=>{
    const name = c.isPlayer?'YOU':('CPU '+(cars.indexOf(c)));
    return `<div class="${c.isPlayer?'me':''}">${i+1}. ${name}</div>`;
  }).join('');
}

let lastT=0;
function loop(t){
  const dt = Math.min(0.033,(t-lastT)/1000||0); lastT=t;
  if(running){
    raceTime += dt;
    cars.forEach(c=>{ if(!c.finished) c.update(dt, c.isPlayer?input:null); });
    camX = player.x; camY = player.y;
    if(player.finished){
      endRace();
    }
  } else if(countdown>0){
    countdown -= dt;
  }
  draw();
  updateHUD();
  requestAnimationFrame(loop);
}

function endRace(){
  running=false;
  const ranked=[...cars].sort((a,b)=>b.progress-a.progress);
  const place = ranked.indexOf(player)+1;
  const ord = place===1?'1st':place===2?'2nd':place===3?'3rd':place+'th';
  document.getElementById('finishStats').innerHTML =
    `FINISHED ${ord} — TIME ${raceTime.toFixed(1)}s`;
  const overlay=document.getElementById('overlay');
  overlay.classList.remove('hide');
  document.getElementById('startBtn').textContent='RACE AGAIN';
}

document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('overlay').classList.add('hide');
  document.getElementById('finishStats').textContent='';
  initRace();
  let cd=3;
  const cdTimer=setInterval(()=>{
    cd--;
    if(cd<=0){ clearInterval(cdTimer); running=true; }
  },800);
});

resize();
initRace();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
